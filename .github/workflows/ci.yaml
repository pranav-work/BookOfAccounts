name: BookOfAccountsWorkflow

on:
  push:
    branches:
      - development
      - release/image
  pull_request:
    branches:
      - development
      - release/image

jobs:
  backend:
    name: Django-backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Run migrations
      - name: Run migrations
        run: python manage.py migrate

      # Lint
      - name: Lint with flake8
        run: flake8 .

      # Run tests with coverage
      - name: Run tests
        run: |
          coverage run manage.py test
          coverage report --fail-under=100

  frontend:
    name: React-Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Lint
      - name: Run ESLint
        run: npm run lint --if-present

      # Run tests
 #     - name: Run tests
 #       run: npm test --if-present

      # Build
      - name: Build project
        run: npm run build

  # detect changes in folders
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    if: github.ref == 'refs/heads/release/image' && github.event_name == 'push'

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}

    steps:
      - uses: action/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend: 
              - 'backend/**'
            frontend:
              - 'frontend/**'

  # Backend Image
  build-backend:
    name: Build Backend Images
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.backend == 'true'
    steps:
      - uses: actions.checkout@v4
      - name: Login to HGCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t ghcr.io/${{ github.repository }}/backend:latest .

      - name: Push backend image
        run: docker push ghcr.io/${{ github.repository }}/backend:latest

  # Frontend Image
  build-frontend:
    name: Build frontend Images
    runs-on: ubuntu-latest
    needs: detect-changes

    if: needs.detect-changes.outputs.frontend == 'true'
    steps:
      - uses: actions.checkout@v4
      - name: Login to HGCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t ghcr.io/${{ github.repository }}/frontend:latest .

      - name: Push frontend image
        run: docker push ghcr.io/${{ github.repository }}/frontend:latest
