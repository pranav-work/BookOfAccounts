[flake8]
max-line-length = 88
exclude =
    .git,
    __pycache__,
    migrations,
    venv,
    env,
    .venv,
    build,
    dist,
    settings
ignore =
    E203,
    W503
max-complexity = 10
statistics = True

[coverage:run]
branch = True
source = .
omit =
    */migrations/*
    */tests/*
    manage.py
    */asgi.py
    */wsgi.py

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 80
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError

[coverage:html]
directory = coverage_html_report

[tool:pytest]
DJANGO_SETTINGS_MODULE = boa.base
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers --tb=short
